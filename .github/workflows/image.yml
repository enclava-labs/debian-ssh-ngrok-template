name: Validate Debian SSH ngrok Template Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/image.yml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "README.md"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/image.yml"
      - "Dockerfile"
      - "entrypoint.sh"
      - "README.md"
      - "scripts/**"

jobs:
  validate:
    name: Validate template image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Shell syntax
        run: |
          sh -n entrypoint.sh
          sh -n scripts/test-image-layout.sh
          sh -n scripts/test-entrypoint-keys.sh
          sh -n scripts/test-entrypoint-ngrok-url.sh
          sh -n scripts/test-entrypoint-config-dir.sh
          sh -n scripts/test-entrypoint-ngrok-api-timeout.sh
          sh -n scripts/test-entrypoint-supervision.sh
          sh -n scripts/test-build-files.sh
          sh -n scripts/test-workflow.sh

      - name: Workflow contract tests
        run: scripts/test-workflow.sh

      - name: Build file tests
        run: scripts/test-build-files.sh

      - name: SSH key validation tests
        run: scripts/test-entrypoint-keys.sh

      - name: ngrok URL validation tests
        run: scripts/test-entrypoint-ngrok-url.sh

      - name: Image layout test
        run: scripts/test-image-layout.sh

      - name: Config directory test
        run: scripts/test-entrypoint-config-dir.sh

      - name: ngrok API timeout test
        run: scripts/test-entrypoint-ngrok-api-timeout.sh

      - name: Supervision test
        run: scripts/test-entrypoint-supervision.sh
